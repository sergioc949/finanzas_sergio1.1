<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastos</title>
<style>
  :root{
    --bg:#f4f4f5;
    --card:#ffffff;
    --border:#e5e7eb;
    --text:#111827;
    --muted:#6b7280;
    --muted2:#9ca3af;
    --dark:#111827;
    --radius:16px;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.03);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 24px 64px}

  /* Header */
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:28px}
  header h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
  header .sub{color:var(--muted);font-size:14px;margin-top:2px}
  .header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  select,.btn{
    font:inherit;font-size:14px;border:1px solid var(--border);background:var(--card);
    color:var(--text);border-radius:10px;padding:9px 16px;cursor:pointer;transition:.15s;
  }
  select{padding-right:30px}
  .btn:hover,select:hover{border-color:#d1d5db;background:#fafafa}

  /* Layout */
  .grid{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
  @media(max-width:860px){.grid{grid-template-columns:1fr}}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:22px}

  /* Form */
  .form h2{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:18px}
  label{display:block;font-size:14px;color:#374151;margin:16px 0 7px}
  label:first-of-type{margin-top:0}
  input[type=number],input[type=text],input[type=date]{
    width:100%;font:inherit;font-size:15px;border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;color:var(--text);background:var(--card);transition:.15s;
  }
  input:focus{outline:none;border-color:#9ca3af;box-shadow:0 0 0 3px rgba(17,24,39,.05)}
  input::placeholder{color:var(--muted2)}

  .cats{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:7px 13px;border-radius:999px;
    border:1px solid var(--border);background:var(--card);cursor:pointer;transition:.15s;user-select:none;color:#374151;
  }
  .chip:hover{background:#fafafa}
  .chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .chip.active{background:var(--dark);color:#fff;border-color:var(--dark)}

  .add-btn{width:100%;margin-top:22px;background:var(--dark);color:#fff;border:none;border-radius:12px;
    padding:14px;font-size:15px;font-weight:600;cursor:pointer;transition:.15s}
  .add-btn:hover{background:#000}

  /* Right column */
  .tabs-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .tabs{display:inline-flex;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:5px}
  .tab{border:none;background:none;font:inherit;font-size:14px;color:var(--muted);padding:8px 20px;border-radius:999px;cursor:pointer;transition:.15s}
  .tab.active{background:var(--dark);color:#fff}
  .nav{display:flex;align-items:center;gap:16px}
  .nav .navbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--card);cursor:pointer;color:var(--muted);font-size:15px;display:flex;align-items:center;justify-content:center;transition:.15s}
  .nav .navbtn:hover{background:#fafafa;color:var(--text)}
  .nav .period-label{font-size:15px;font-weight:500;min-width:150px;text-align:center}

  /* Metrics */
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  @media(max-width:640px){.metrics{grid-template-columns:repeat(2,1fr)}}
  .metric{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .metric .k{font-size:11px;font-weight:600;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;min-height:30px}
  .metric .v{font-size:24px;font-weight:700;margin-top:8px;letter-spacing:-.02em}
  .metric .v.small{font-size:20px}
  .metric .v .up{color:#dc2626}
  .metric .v .down{color:#16a34a}

  /* Section cards */
  .section{margin-bottom:24px}
  .section h3{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding:22px 22px 0}
  .chart-area{padding:18px 22px 22px;min-height:190px;display:flex;align-items:center;justify-content:center}
  .empty{color:var(--muted2);font-size:14px}

  /* Bar chart */
  .bars{display:flex;align-items:flex-end;gap:10px;width:100%;height:180px;padding-top:10px}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
  .bar{width:100%;max-width:44px;background:var(--dark);border-radius:7px 7px 4px 4px;transition:.3s;min-height:2px;position:relative}
  .bar-col .lbl{font-size:11px;color:var(--muted);text-align:center;white-space:nowrap}
  .bar-col .amt{font-size:11px;color:var(--muted2);height:14px}

  /* Category breakdown */
  .catlist{padding:8px 22px 22px;display:flex;flex-direction:column;gap:14px}
  .catrow{display:flex;align-items:center;gap:12px}
  .catrow .name{display:flex;align-items:center;gap:9px;font-size:14px;min-width:110px}
  .catrow .name .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .catrow .track{flex:1;height:9px;background:#f0f0f1;border-radius:999px;overflow:hidden}
  .catrow .fill{height:100%;border-radius:999px;transition:.3s}
  .catrow .val{font-size:13px;color:var(--muted);min-width:96px;text-align:right;font-variant-numeric:tabular-nums}

  /* Recent list */
  .items{padding:6px 22px 14px;display:flex;flex-direction:column}
  .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f3f4f6}
  .item:last-child{border-bottom:none}
  .item .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .item .info{flex:1;min-width:0}
  .item .info .desc{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .info .meta{font-size:12px;color:var(--muted2);margin-top:2px}
  .item .amt{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .item .del{border:none;background:none;color:var(--muted2);cursor:pointer;font-size:18px;padding:2px 6px;border-radius:6px;line-height:1;transition:.15s}
  .item .del:hover{background:#fef2f2;color:#dc2626}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Gastos</h1>
      <div class="sub">Tus datos se guardan solo en este navegador.</div>
    </div>
    <div class="header-actions">
      <select id="currency" title="Moneda">
        <option value="EUR">EUR</option>
        <option value="USD">USD</option>
        <option value="MXN">MXN</option>
        <option value="COP">COP</option>
        <option value="GBP">GBP</option>
      </select>
      <button class="btn" id="exportBtn">Exportar</button>
      <button class="btn" id="importBtn">Importar</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </header>

  <div class="grid">

    <!-- Formulario -->
    <div class="card pad form">
      <h2>Nuevo gasto</h2>
      <form id="expenseForm">
        <label id="amountLabel" for="amount">Importe (EUR)</label>
        <input type="number" id="amount" step="0.01" min="0" placeholder="0,00" required>

        <label>Categoría</label>
        <div class="cats" id="cats"></div>

        <label for="desc">Descripción (opcional)</label>
        <input type="text" id="desc" placeholder="Café, metro, alquiler…">

        <label for="date">Fecha</label>
        <input type="date" id="date" required>

        <button type="submit" class="add-btn">Añadir gasto</button>
      </form>
    </div>

    <!-- Panel derecho -->
    <div>
      <div class="tabs-row">
        <div class="tabs" id="tabs">
          <button class="tab active" data-view="day">Día</button>
          <button class="tab" data-view="week">Semana</button>
          <button class="tab" data-view="month">Mes</button>
        </div>
        <div class="nav">
          <button class="navbtn" id="prev">‹</button>
          <span class="period-label" id="periodLabel">—</span>
          <button class="navbtn" id="next">›</button>
        </div>
      </div>

      <div class="metrics">
        <div class="metric">
          <div class="k">Total del periodo</div>
          <div class="v" id="mTotal">0,00 €</div>
        </div>
        <div class="metric">
          <div class="k" id="mAvgLabel">Media diaria</div>
          <div class="v" id="mAvg">0,00 €</div>
        </div>
        <div class="metric">
          <div class="k">Nº de gastos</div>
          <div class="v" id="mCount">0</div>
        </div>
        <div class="metric">
          <div class="k" id="mVsLabel">Vs. ayer</div>
          <div class="v small" id="mVs">—</div>
        </div>
      </div>

      <div class="card section">
        <h3 id="chartTitle">Últimos 7 días</h3>
        <div class="chart-area" id="chartArea"></div>
      </div>

      <div class="card section">
        <h3>Por categoría</h3>
        <div id="catBreakdown"></div>
      </div>

      <div class="card section">
        <h3>Movimientos</h3>
        <div id="itemsList"></div>
      </div>
    </div>

  </div>
</div>

<script>
/* ---------- Datos base ---------- */
const CATEGORIES = [
  {id:'comida',    name:'Comida',    color:'#f97316'},
  {id:'transporte',name:'Transporte',color:'#3b82f6'},
  {id:'hogar',     name:'Hogar',     color:'#a855f7'},
  {id:'ocio',      name:'Ocio',      color:'#ec4899'},
  {id:'salud',     name:'Salud',     color:'#10b981'},
  {id:'compras',   name:'Compras',   color:'#eab308'},
  {id:'servicios', name:'Servicios', color:'#2563eb'},
  {id:'otros',     name:'Otros',     color:'#6b7280'},
];
const catMap = Object.fromEntries(CATEGORIES.map(c=>[c.id,c]));

const CURRENCY_SYMBOL = {EUR:'€',USD:'$',MXN:'$',COP:'$',GBP:'£'};

const STORE_KEY = 'gastos_app_v1';
const state = {
  expenses: [],
  currency: 'EUR',
  view: 'day',
  selectedCat: 'comida',
  cursor: new Date(),   // fecha de referencia del periodo
};

/* ---------- Persistencia ---------- */
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      state.expenses = Array.isArray(d.expenses)?d.expenses:[];
      state.currency = d.currency || 'EUR';
    }
  }catch(e){ console.warn('No se pudo cargar', e); }
}
function save(){
  localStorage.setItem(STORE_KEY, JSON.stringify({
    expenses: state.expenses,
    currency: state.currency,
  }));
}

/* ---------- Utilidades de fecha ---------- */
const DAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseYmd(s){ const [y,m,dd]=s.split('-').map(Number); return new Date(y,m-1,dd); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function startOfWeek(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; } // lunes
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }

/* Devuelve {start,end} del periodo actual según vista (end exclusivo) */
function periodRange(){
  const c = state.cursor;
  if(state.view==='day'){
    const s=new Date(c.getFullYear(),c.getMonth(),c.getDate());
    return {start:s, end:addDays(s,1)};
  }
  if(state.view==='week'){
    const s=startOfWeek(c);
    return {start:s, end:addDays(s,7)};
  }
  const s=new Date(c.getFullYear(),c.getMonth(),1);
  const e=new Date(c.getFullYear(),c.getMonth()+1,1);
  return {start:s, end:e};
}

/* Periodo anterior equivalente para comparativa */
function prevPeriodRange(){
  const {start,end}=periodRange();
  if(state.view==='day')   return {start:addDays(start,-1), end:start};
  if(state.view==='week')  return {start:addDays(start,-7), end:start};
  const s=new Date(start.getFullYear(),start.getMonth()-1,1);
  return {start:s, end:start};
}

/* ---------- Formato ---------- */
function fmt(n){
  const sym = CURRENCY_SYMBOL[state.currency] || '';
  return n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ' + sym;
}

/* ---------- Cálculos ---------- */
function inRange(exp, r){ const d=parseYmd(exp.date); return d>=r.start && d<r.end; }
function sumRange(r){ return state.expenses.filter(e=>inRange(e,r)).reduce((a,e)=>a+e.amount,0); }

/* ---------- Render ---------- */
function renderCats(){
  const box=document.getElementById('cats');
  box.innerHTML='';
  CATEGORIES.forEach(c=>{
    const el=document.createElement('div');
    el.className='chip'+(c.id===state.selectedCat?' active':'');
    el.innerHTML=`<span class="dot" style="background:${c.color}"></span>${c.name}`;
    el.onclick=()=>{ state.selectedCat=c.id; renderCats(); };
    box.appendChild(el);
  });
}

function renderPeriodLabel(){
  const c=state.cursor, lbl=document.getElementById('periodLabel');
  if(state.view==='day'){
    lbl.textContent = cap(DAYS[c.getDay()])+' '+c.getDate()+' de '+MONTHS[c.getMonth()];
  }else if(state.view==='week'){
    const s=startOfWeek(c), e=addDays(s,6);
    const sameMonth = s.getMonth()===e.getMonth();
    lbl.textContent = s.getDate()+(sameMonth?'':' '+MONTHS[s.getMonth()])+' – '+e.getDate()+' '+MONTHS[e.getMonth()];
  }else{
    lbl.textContent = cap(MONTHS[c.getMonth()])+' '+c.getFullYear();
  }
}

function renderMetrics(){
  const r=periodRange();
  const list=state.expenses.filter(e=>inRange(e,r));
  const total=list.reduce((a,e)=>a+e.amount,0);
  document.getElementById('mTotal').textContent=fmt(total);
  document.getElementById('mCount').textContent=list.length;

  // media
  const avgLabel=document.getElementById('mAvgLabel');
  const avgEl=document.getElementById('mAvg');
  if(state.view==='day'){ avgLabel.textContent='Media por gasto'; avgEl.textContent=fmt(list.length?total/list.length:0); }
  else if(state.view==='week'){ avgLabel.textContent='Media diaria'; avgEl.textContent=fmt(total/7); }
  else{ const days=new Date(state.cursor.getFullYear(),state.cursor.getMonth()+1,0).getDate(); avgLabel.textContent='Media diaria'; avgEl.textContent=fmt(total/days); }

  // comparativa
  const vsLabel=document.getElementById('mVsLabel');
  const vsEl=document.getElementById('mVs');
  vsLabel.textContent = state.view==='day'?'Vs. ayer':(state.view==='week'?'Vs. semana ant.':'Vs. mes ant.');
  const prev=sumRange(prevPeriodRange());
  if(prev===0 && total===0){ vsEl.innerHTML='—'; }
  else if(prev===0){ vsEl.innerHTML='<span class="up">+100 %</span>'; }
  else{
    const pct=Math.round((total-prev)/prev*100);
    const cls=pct>0?'up':(pct<0?'down':'');
    const sign=pct>0?'+':'';
    vsEl.innerHTML=`<span class="${cls}">${sign}${pct} %</span>`;
  }
}

function renderChart(){
  const area=document.getElementById('chartArea');
  const title=document.getElementById('chartTitle');
  let buckets=[]; // {label, amount}

  if(state.view==='day'){
    title.textContent='Últimos 7 días';
    const base=new Date(state.cursor.getFullYear(),state.cursor.getMonth(),state.cursor.getDate());
    for(let i=6;i>=0;i--){
      const d=addDays(base,-i);
      buckets.push({label:['D','L','M','X','J','V','S'][d.getDay()], amount:sumRange({start:d,end:addDays(d,1)})});
    }
  }else if(state.view==='week'){
    title.textContent='Días de la semana';
    const s=startOfWeek(state.cursor);
    const names=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
    for(let i=0;i<7;i++){
      const d=addDays(s,i);
      buckets.push({label:names[i], amount:sumRange({start:d,end:addDays(d,1)})});
    }
  }else{
    title.textContent='Días del mes';
    const y=state.cursor.getFullYear(), m=state.cursor.getMonth();
    const days=new Date(y,m+1,0).getDate();
    for(let i=1;i<=days;i++){
      const d=new Date(y,m,i);
      buckets.push({label:String(i), amount:sumRange({start:d,end:addDays(d,1)})});
    }
  }

  const max=Math.max(...buckets.map(b=>b.amount),0);
  if(max===0){ area.innerHTML='<div class="empty">Sin gastos en este periodo</div>'; return; }

  const showAmt = buckets.length<=7;
  area.innerHTML='<div class="bars">'+buckets.map(b=>{
    const h=max?Math.max((b.amount/max)*100,1):1;
    return `<div class="bar-col">
      <div class="amt">${showAmt && b.amount>0 ? b.amount.toLocaleString('es-ES',{maximumFractionDigits:0}) : ''}</div>
      <div class="bar" style="height:${h}%" title="${fmt(b.amount)}"></div>
      <div class="lbl">${b.label}</div>
    </div>`;
  }).join('')+'</div>';
}

function renderCatBreakdown(){
  const box=document.getElementById('catBreakdown');
  const r=periodRange();
  const list=state.expenses.filter(e=>inRange(e,r));
  const total=list.reduce((a,e)=>a+e.amount,0);
  if(total===0){ box.innerHTML='<div class="chart-area"><div class="empty">Sin gastos en este periodo</div></div>'; return; }

  const byCat={};
  list.forEach(e=>{ byCat[e.category]=(byCat[e.category]||0)+e.amount; });
  const rows=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);

  box.innerHTML='<div class="catlist">'+rows.map(([id,amt])=>{
    const c=catMap[id]||catMap.otros;
    const pct=Math.round(amt/total*100);
    return `<div class="catrow">
      <div class="name"><span class="dot" style="background:${c.color}"></span>${c.name}</div>
      <div class="track"><div class="fill" style="width:${pct}%;background:${c.color}"></div></div>
      <div class="val">${fmt(amt)} · ${pct}%</div>
    </div>`;
  }).join('')+'</div>';
}

function renderItems(){
  const box=document.getElementById('itemsList');
  const r=periodRange();
  const list=state.expenses.filter(e=>inRange(e,r)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  if(list.length===0){ box.innerHTML='<div class="chart-area"><div class="empty">Sin movimientos en este periodo</div></div>'; return; }

  box.innerHTML='<div class="items">'+list.map(e=>{
    const c=catMap[e.category]||catMap.otros;
    const d=parseYmd(e.date);
    const meta=c.name+' · '+d.getDate()+' '+MONTHS[d.getMonth()];
    return `<div class="item">
      <span class="dot" style="background:${c.color}"></span>
      <div class="info">
        <div class="desc">${e.desc?escapeHtml(e.desc):c.name}</div>
        <div class="meta">${meta}</div>
      </div>
      <div class="amt">${fmt(e.amount)}</div>
      <button class="del" title="Eliminar" onclick="deleteExpense(${e.id})">×</button>
    </div>`;
  }).join('')+'</div>';
}

function escapeHtml(s){ return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function renderAll(){
  document.getElementById('amountLabel').textContent='Importe ('+state.currency+')';
  renderPeriodLabel();
  renderMetrics();
  renderChart();
  renderCatBreakdown();
  renderItems();
}

/* ---------- Acciones ---------- */
function deleteExpense(id){
  state.expenses=state.expenses.filter(e=>e.id!==id);
  save(); renderAll();
}
window.deleteExpense=deleteExpense;

/* ---------- Eventos ---------- */
function initEvents(){
  // tabs
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick=()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      state.view=t.dataset.view;
      state.cursor=new Date();
      renderAll();
    };
  });

  // navegación
  document.getElementById('prev').onclick=()=>{ shiftCursor(-1); };
  document.getElementById('next').onclick=()=>{ shiftCursor(1); };

  // moneda
  const cur=document.getElementById('currency');
  cur.value=state.currency;
  cur.onchange=()=>{ state.currency=cur.value; save(); renderAll(); };

  // formulario
  document.getElementById('expenseForm').onsubmit=e=>{
    e.preventDefault();
    const amount=parseFloat(document.getElementById('amount').value);
    if(!(amount>0)) return;
    state.expenses.push({
      id:Date.now(),
      amount:Math.round(amount*100)/100,
      category:state.selectedCat,
      desc:document.getElementById('desc').value.trim(),
      date:document.getElementById('date').value,
    });
    save();
    document.getElementById('amount').value='';
    document.getElementById('desc').value='';
    renderAll();
  };

  // exportar / importar
  document.getElementById('exportBtn').onclick=exportData;
  document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
  document.getElementById('importFile').onchange=importData;
}

function shiftCursor(dir){
  const c=state.cursor;
  if(state.view==='day') state.cursor=addDays(c,dir);
  else if(state.view==='week') state.cursor=addDays(c,7*dir);
  else state.cursor=new Date(c.getFullYear(),c.getMonth()+dir,1);
  renderAll();
}

function exportData(){
  const blob=new Blob([JSON.stringify({expenses:state.expenses,currency:state.currency},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='gastos-'+ymd(new Date())+'.json';
  a.click(); URL.revokeObjectURL(url);
}

function importData(ev){
  const file=ev.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const d=JSON.parse(reader.result);
      if(Array.isArray(d.expenses)){
        state.expenses=d.expenses;
        if(d.currency) state.currency=d.currency;
        document.getElementById('currency').value=state.currency;
        save(); renderAll();
      }else{ alert('El archivo no tiene el formato esperado.'); }
    }catch(err){ alert('No se pudo leer el archivo.'); }
    ev.target.value='';
  };
  reader.readAsText(file);
}

/* ---------- Init ---------- */
load();
document.getElementById('date').value=ymd(new Date());
renderCats();
initEvents();
renderAll();
</script>
